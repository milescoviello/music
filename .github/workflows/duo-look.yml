name: iPhone Duo look

# The app on the iPhone Duo simulator, folded and unfolded, photographed. The build VM is
# an Intel Mac and Apple publishes iOS 27 simulators for Apple silicon only, so this runs
# on GitHub's xcode-27 image. simctl has no way to fold the simulator; `hinge`
# (github.com/artemnovichkov/hinge, MIT, pinned to v0.3.1) sets the hinge through the
# same private event as Device Hub's hidden slider. Nothing is published: the pictures
# are the run's artifact. Run by hand (Actions > iPhone Duo look) or by pushing the
# duo-look branch; never for pull requests.

on:
    workflow_dispatch:
    push:
        branches: [duo-look]

permissions:
    contents: read

jobs:
    look:
        runs-on: xcode-27
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v5

            - name: Xcode 27.2 and hinge
              run: |
                  sudo xcode-select -s /Applications/Xcode_27.2.app
                  git clone --quiet https://github.com/artemnovichkov/hinge.git "$RUNNER_TEMP/hinge"
                  git -C "$RUNNER_TEMP/hinge" checkout --quiet 06cb720276281da7f1aadd3874acb0d0ae5eb2b5
                  echo "HINGE=$RUNNER_TEMP/hinge/skills/hinge/scripts/hinge" >> "$GITHUB_ENV"

            - name: Boot an iPhone Duo and install the app
              run: |
                  # The newest runtime that can run a Duo, not simply the newest: on 11-27 that one refused ("Incompatible device").
                  xcrun simctl list runtimes
                  RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable'] and any(t.get('identifier','').endswith('.iPhone-Duo') for t in x.get('supportedDeviceTypes', []))]; print(sorted(r, key=lambda x: x['version'])[-1]['identifier'])")
                  UDID=$(xcrun simctl create duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$RUNTIME")
                  echo "UDID=$UDID" >> "$GITHUB_ENV"
                  echo "HINGE_DEVICE=$UDID" >> "$GITHUB_ENV"
                  xcrun simctl boot "$UDID"
                  xcrun simctl bootstatus "$UDID" -b > /dev/null
                  xcodebuild -project Music.xcodeproj -scheme Music -configuration Debug \
                    -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" build \
                    CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD" | tail -20
                  xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Music.app"

                  # GitHub can't reach the real server, and the app signs in only to one that
                  # answers. This stand-in says "ok" to everything and has nothing in it:
                  # enough to get past the setup screen to the tabs, where the screens that
                  # ask for music show their empty or error states. The simulator build signs
                  # in from SIMCTL_CHILD_MUSIC_* (AppState.signInFromLaunchEnvironment).
                  cat > "$RUNNER_TEMP/standin.py" <<'PY'
                  import http.server, json
                  OK = json.dumps({"subsonic-response": {"status": "ok", "version": "1.16.1"}}).encode()
                  class Answer(http.server.BaseHTTPRequestHandler):
                      def do_GET(self):
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(OK)))
                          self.end_headers()
                          self.wfile.write(OK)
                      do_POST = do_GET
                      def log_message(self, *args):
                          pass
                  # sonic's stand-in, for Stats and Wrapped: a made-up year of plays (invented names), handed
                  # over the way another device's would be, through the taste log.
                  import random, threading, time, uuid
                  random.seed(7)
                  ARTISTS = ["Lanterns Under Glass", "Juniper Vale", "Static Orchard", "Copper Tide", "Low Meridian",
                             "Velvet Arcade", "North Ember", "Quiet Engines", "Saltwater Radio", "Paper Satellites"]
                  GENRES = ["Dream Pop", "Indie Rock", "Electronic", "Jazz", "Hip-Hop"]
                  start = time.mktime((2026, 1, 1, 0, 0, 0, 0, 0, -1)); now = time.time()
                  EVENTS = []
                  for n in range(3000):
                      a = min(int(random.expovariate(0.45)), len(ARTISTS) - 1)
                      song = min(int(random.expovariate(0.6)), 5)
                      EVENTS.append({"id": str(uuid.UUID(int=random.getrandbits(128))).upper(), "kind": "play",
                                     "at": start + random.random() * (now - start), "songID": f"fake-{a}-{song}",
                                     "title": f"Song {song + 1} of {ARTISTS[a].split()[0]}", "artist": ARTISTS[a],
                                     "album": f"{ARTISTS[a]} Sessions", "genre": GENRES[a % len(GENRES)],
                                     "duration": random.randint(150, 300)})
                  EVENTS.sort(key=lambda e: e["at"])
                  SUMMARY = {"plays": len(EVENTS), "seconds": sum(e["duration"] for e in EVENTS), "first": EVENTS[0]["at"],
                             "last": EVENTS[-1]["at"], "lastRow": 0}
                  import sys
                  def note(kind, path):
                      print(time.strftime("%H:%M:%S"), kind, path[:160], file=sys.stderr, flush=True)
                  class Sonic(http.server.BaseHTTPRequestHandler):
                      def reply(self, body, code=200):
                          data = json.dumps(body).encode()
                          self.send_response(code)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)
                      def do_GET(self):
                          note("sonic GET", self.path)
                          path = self.path.split("?")[0]
                          if path == "/v1/taste":
                              since = int((self.path.split("since=") + ["0"])[1].split("&")[0] or 0)
                              return self.reply({"events": EVENTS if since == 0 else [], "seq": len(EVENTS)})
                          if path == "/v1/history/plays":
                              return self.reply({"plays": [], "after": 0, "more": False})
                          if path == "/v1/history/summary":
                              return self.reply(SUMMARY)
                          return self.reply({"error": "no such endpoint"}, 404)
                      def do_POST(self):
                          note("sonic POST", self.path)
                          self.rfile.read(int(self.headers.get("Content-Length") or 0))
                          return self.reply({"added": 0, "seq": len(EVENTS)})
                      def log_message(self, *args):
                          pass
                  threading.Thread(target=http.server.ThreadingHTTPServer(("127.0.0.1", 8650), Sonic).serve_forever, daemon=True).start()
                  http.server.ThreadingHTTPServer(("127.0.0.1", 4533), Answer).serve_forever()
                  PY
                  nohup python3 "$RUNNER_TEMP/standin.py" > "$RUNNER_TEMP/standin.log" 2>&1 &
                  for try in $(seq 1 20); do
                      curl -sf "http://127.0.0.1:4533/rest/ping.view?f=json" && break
                      sleep 1
                  done
                  echo; cat "$RUNNER_TEMP/standin.log"
                  curl -sf "http://127.0.0.1:8650/v1/history/summary"; echo
                  # sonic's address, the stand-in's, from SIMCTL_CHILD_MUSIC_SONIC (SonicService, simulator only).
                  SIMCTL_CHILD_MUSIC_SONIC=http://127.0.0.1:8650 SIMCTL_CHILD_MUSIC_SERVER=http://127.0.0.1:4533 SIMCTL_CHILD_MUSIC_USER=look SIMCTL_CHILD_MUSIC_PASSWORD=look \
                    xcrun simctl launch "$UDID" com.milescoviello.music
                  sleep 12

            - name: Folded, unfolded, unfolded on its side, folded again
              run: |
                  mkdir -p "$RUNNER_TEMP/shots"
                  shot() { sleep 3; "$HINGE" posture; "$HINGE" screenshot "$RUNNER_TEMP/shots/$1.png"; }
                  "$HINGE" -v
                  "$HINGE" close;  shot 1-folded
                  "$HINGE" open;   shot 2-unfolded
                  "$HINGE" orient landscape-left; shot 3-unfolded-landscape
                  "$HINGE" orient portrait
                  "$HINGE" half;   shot 4-half-open
                  "$HINGE" close;  shot 5-folded-again
                  # Still running after all that: a crash on a fold would have ended it.
                  xcrun simctl spawn "$UDID" launchctl list | grep -i com.milescoviello.music || echo "Music is NOT running"
                  sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP"/shots/*.png

            - name: Stats and the Wrapped story, unfolded
              run: |
                  # Opened from the launch environment (MainTabView.openFromLaunchEnvironment, simulator only):
                  # Stats after 3 s, its Wrapped story 20 s later, then a picture every 4 s as the pages move on.
                  xcrun simctl terminate "$UDID" com.milescoviello.music || true
                  "$HINGE" open
                  sleep 3
                  date +"%H:%M:%S launching for Stats and Wrapped" >> "$RUNNER_TEMP/standin.log"
                  SIMCTL_CHILD_MUSIC_SHOW=wrapped SIMCTL_CHILD_MUSIC_SONIC=http://127.0.0.1:8650 SIMCTL_CHILD_MUSIC_SERVER=http://127.0.0.1:4533 SIMCTL_CHILD_MUSIC_USER=look \
                    SIMCTL_CHILD_MUSIC_PASSWORD=look xcrun simctl launch "$UDID" com.milescoviello.music
                  sleep 18
                  "$HINGE" screenshot "$RUNNER_TEMP/shots/6-stats.png"; date +"%H:%M:%S took 6-stats" >> "$RUNNER_TEMP/standin.log"
                  sleep 6
                  for n in $(seq -w 1 20); do sleep 4; "$HINGE" screenshot "$RUNNER_TEMP/shots/7-wrapped-$n.png"; done
                  xcrun simctl spawn "$UDID" launchctl list | grep -i com.milescoviello.music || echo "Music is NOT running"
                  cp "$RUNNER_TEMP/standin.log" "$RUNNER_TEMP/shots/standin.log"

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: duo-look
                  path: ${{ runner.temp }}/shots
