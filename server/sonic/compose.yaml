# Runs on the 148 host beside Navidrome and the music share. It writes to ./data, and to
# the music only to save lyrics fixed in the app (`lyricsfile`): the .lrc beside a song,
# or a song's tags, checked to leave its audio as it was. Navidrome's own database stays
# read-only.
services:
  sonic:
    build: .
    image: sonic:latest
    container_name: sonic
    restart: unless-stopped
    user: "1000:1000"
    # The host's network, not a published port: the lyric translations ask Ollama, which
    # listens on the host's loopback only. Still port 8650 for the apps.
    network_mode: host
    environment:
      SONIC_DATA: /data
      SONIC_NAVIDROME_DB: /navidrome/navidrome.db
      # Navidrome's library roots, as Navidrome sees them, to where they are mounted here.
      SONIC_PATH_MAP: /music/my_music=/mnt/hdd-pool-media/my_music,/music/music=/mnt/hdd-pool-media/music
      SONIC_WORKERS: "4"
      SONIC_RESYNC_HOURS: "6"
      # The Shows shelf's Ticketmaster key, from ./.env beside this file -- never in git.
      SONIC_TICKETMASTER_KEY: ${SONIC_TICKETMASTER_KEY:-}
    volumes:
      - ./data:/data
      - /home/miles/media-stack/navidrome/data:/navidrome:ro
      - /mnt/hdd-pool-media/my_music:/mnt/hdd-pool-media/my_music:rw,rslave
      - /mnt/hdd-pool-media/music:/mnt/hdd-pool-media/music:rw,rslave
    # Leave the host room for everything else it runs.
    cpus: 6
    mem_limit: 6g
